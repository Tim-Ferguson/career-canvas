<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ece8df">
    <meta name="description" content="A typed, local-first resume JSON editor and PDF layout studio.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Résumé Studio</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="./"><span>R/</span><strong>Résumé Studio</strong></a>
      <div class="header-actions">
        <label class="layout-label">Layout <select id="layout"><option value="classic">Classic</option><option value="editorial">Editorial</option><option value="compact">Compact</option></select></label>
        <button id="print" class="primary" type="button">Save as PDF</button>
      </div>
    </header>
    <main class="workspace">
      <aside class="editor-panel" aria-labelledby="editor-title">
        <div class="panel-heading"><div><p>Portable source</p><h1 id="editor-title">Edit the résumé JSON</h1></div><span>Strict schema v1</span></div>
        <div class="toolbar">
          <button id="save" type="button">Save template</button>
          <button id="copy" type="button">Copy JSON</button>
          <button id="download" type="button">Download</button>
          <label class="file-button">Import<input id="import" type="file" accept="application/json,.json"></label>
          <button id="reset" type="button">Reset</button>
        </div>
        <label class="json-label" for="json-editor">Resume document</label>
        <textarea id="json-editor" spellcheck="false" aria-describedby="json-help json-error"></textarea>
        <p id="json-error" class="error" role="alert" hidden></p>
        <p id="json-help" class="help">The preview keeps the last valid document while you repair malformed JSON.</p>
        <section class="ordering" aria-labelledby="ordering-title">
          <div><p>Document flow</p><h2 id="ordering-title">Move sections</h2></div>
          <p>Drag rows or use the arrow buttons.</p>
          <ol id="section-list"></ol>
        </section>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </aside>
      <section class="preview-panel" aria-label="Resume preview">
        <div class="page-label"><span>Live preview</span><small>Letter · browser PDF</small></div>
        <article id="resume-preview" class="resume-page"></article>
      </section>
    </main>
    <script type="module" src="dist/app.js"></script>
  </body>
</html>
